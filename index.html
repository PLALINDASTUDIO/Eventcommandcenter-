function renderSmartTools(host){
  host.innerHTML = `
    <div class="page-header"><div><h2>Smart Tools</h2><div class="page-header-sub">Handy calculators for planning ${escapeHtml(activeEventTypeLabel())}. Everything works offline.</div></div></div>
    <div class="bento" id="smartToolsGrid">
      <div class="card tool-card span-6"><div class="card-title">${icon('clock')} Event Countdown</div>
        <p class="tool-hint">Uses your event date to show exactly how much time is left.</p>
        <div class="tool-result" id="tool_countdown">${countdownFullText()}</div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('calc')} Per-Guest Cost</div>
        <p class="tool-hint">Total cost ÷ guest count.</p>
        <div class="form-grid"><div class="field"><label>Total Cost</label><input type="number" min="0" id="pg_total" value="${STATE.event.totalBudget||0}"></div>
        <div class="field"><label>Guest Count</label><input type="number" min="0" id="pg_guests" value="${STATE.event.guestCount||0}"></div></div>
        <button class="btn btn-primary btn-sm" id="pg_calc">Calculate</button>
        <div class="tool-result hidden" id="pg_result"></div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('percent')} Budget Splitter</div>
        <p class="tool-hint">Split a total amount across categories by percentage.</p>
        <div class="field"><label>Total Amount</label><input type="number" min="0" id="bs_total" value="${STATE.event.totalBudget||0}"></div>
        <div id="bs_rows"></div>
        <button class="btn btn-sm" id="bs_addrow">${icon('plus')} Add Category</button>
        <button class="btn btn-primary btn-sm" id="bs_calc">Calculate Split</button>
        <div class="tool-result hidden" id="bs_result"></div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('seat')} Seating / Table Calculator</div>
        <p class="tool-hint">Guest count ÷ seats per table, rounded up.</p>
        <div class="form-grid"><div class="field"><label>Guest Count</label><input type="number" min="0" id="st_guests" value="${STATE.event.guestCount||0}"></div>
        <div class="field"><label>Seats per Table</label><input type="number" min="1" id="st_seats" value="8"></div></div>
        <button class="btn btn-primary btn-sm" id="st_calc">Calculate</button>
        <div class="tool-result hidden" id="st_result"></div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('drink')} Drink Estimator</div>
        <p class="tool-hint">Rough estimate based on guest count, duration and drinks per hour. This is an estimate — adjust for your event.</p>
        <div class="form-grid"><div class="field"><label>Guest Count</label><input type="number" min="0" id="de_guests" value="${STATE.event.guestCount||0}"></div>
        <div class="field"><label>Duration (hours)</label><input type="number" min="0" id="de_hours" value="4"></div>
        <div class="field full"><label>Drinks per Guest per Hour</label><input type="number" min="0" step="0.1" id="de_rate" value="1"></div></div>
        <button class="btn btn-primary btn-sm" id="de_calc">Estimate</button>
        <div class="tool-result hidden" id="de_result"></div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('percent')} Tip / Gratuity Calculator</div>
        <div class="form-grid"><div class="field"><label>Amount</label><input type="number" min="0" id="tip_amt" value="0"></div>
        <div class="field"><label>Percentage (%)</label><input type="number" min="0" id="tip_pct" value="18"></div></div>
        <button class="btn btn-primary btn-sm" id="tip_calc">Calculate</button>
        <div class="tool-result hidden" id="tip_result"></div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('clock')} Timeline Duration Calculator</div>
        <div class="form-grid"><div class="field"><label>Start Time</label><input type="time" id="td_start" value="18:00"></div>
        <div class="field"><label>End Time</label><input type="time" id="td_end" value="23:00"></div></div>
        <button class="btn btn-primary btn-sm" id="td_calc">Calculate</button>
        <div class="tool-result hidden" id="td_result"></div>
      </div>
      <div class="card tool-card span-6"><div class="card-title">${icon('wallet')} Deposit Calculator</div>
        <p class="tool-hint">Useful for vendor deposits and payments.</p>
        <div class="form-grid"><div class="field"><label>Total Amount</label><input type="number" min="0" id="dep_amt" value="0"></div>
        <div class="field"><label>Deposit Percentage (%)</label><input type="number" min="0" max="100" id="dep_pct" value="30"></div></div>
        <button class="btn btn-primary btn-sm" id="dep_calc">Calculate</button>
        <div class="tool-result hidden" id="dep_result"></div>
      </div>
    </div>
  `;
  // Per-guest cost
  qs('#pg_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const total = parseFloat(qs('#pg_total').value)||0, guests = parseFloat(qs('#pg_guests').value)||0;
    const r = qs('#pg_result'); r.classList.remove('hidden');
    r.textContent = guests>0 ? `${money(total/guests)} per guest` : 'Enter a guest count greater than 0.';
    consumeTrialCredit();
  });
  // Budget splitter
  let bsRows = [{cat:'Venue',pct:40},{cat:'Food',pct:35},{cat:'Decor',pct:25}];
  function renderBsRows(){
    qs('#bs_rows').innerHTML = bsRows.map((r,i)=>`<div class="flex gap-8 mt-2" style="align-items:center;"><input type="text" data-bsrow-cat="${i}" value="${escapeHtml(r.cat)}" style="flex:2;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink)">
      <input type="number" min="0" max="100" data-bsrow-pct="${i}" value="${r.pct}" style="flex:1;min-width:0;width:0;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink)">
      <button class="icon-btn btn-sm" data-bsrow-del="${i}" style="flex-shrink:0;" aria-label="Remove category">${icon('x')}</button></div>`).join('');
    qsa('[data-bsrow-cat]').forEach(inp=> inp.addEventListener('input', e=> bsRows[+e.target.dataset.bsrowCat].cat = e.target.value));
    qsa('[data-bsrow-pct]').forEach(inp=> inp.addEventListener('input', e=> bsRows[+e.target.dataset.bsrowPct].pct = parseFloat(e.target.value)||0));
    qsa('[data-bsrow-del]').forEach(b=> b.addEventListener('click', e=>{ bsRows.splice(+e.currentTarget.dataset.bsrowDel,1); renderBsRows(); }));
  }
  renderBsRows();
  qs('#bs_addrow').addEventListener('click', ()=>{ bsRows.push({cat:'New Category',pct:0}); renderBsRows(); });
  qs('#bs_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const total = parseFloat(qs('#bs_total').value)||0;
    const pctSum = bsRows.reduce((s,r)=>s+r.pct,0);
    const r = qs('#bs_result'); r.classList.remove('hidden');
    if(pctSum<=0){ r.textContent='Add category percentages greater than 0.'; return; }
    r.innerHTML = bsRows.map(row=> `${escapeHtml(row.cat)}: ${money(total * row.pct/pctSum)}`).join('<br>') + (Math.round(pctSum)!==100? `<div class="stat-sub mt-2">Percentages total ${pctSum}% — amounts are normalized to 100%.</div>`:'');
    consumeTrialCredit();
  });
  // Seating calculator
  qs('#st_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const guests = parseFloat(qs('#st_guests').value)||0, seats = parseFloat(qs('#st_seats').value)||1;
    const r = qs('#st_result'); r.classList.remove('hidden');
    r.textContent = seats>0? `${Math.ceil(guests/seats)} tables needed` : 'Enter seats per table greater than 0.';
    consumeTrialCredit();
  });
  // Drink estimator
  qs('#de_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const guests=parseFloat(qs('#de_guests').value)||0, hours=parseFloat(qs('#de_hours').value)||0, rate=parseFloat(qs('#de_rate').value)||0;
    const r = qs('#de_result'); r.classList.remove('hidden');
    const total = Math.ceil(guests*hours*rate);
    r.innerHTML = `≈ ${total} drinks total <div class="stat-sub mt-2">This is an estimate — adjust for your guests' preferences.</div>`;
    consumeTrialCredit();
  });
  // Tip calculator
  qs('#tip_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const amt=parseFloat(qs('#tip_amt').value)||0, pct=parseFloat(qs('#tip_pct').value)||0;
    const r=qs('#tip_result'); r.classList.remove('hidden');
    r.innerHTML = `Tip: ${money(amt*pct/100)} <div class="stat-sub mt-2">Total with tip: ${money(amt*(1+pct/100))}</div>`;
    consumeTrialCredit();
  });
  // Timeline duration
  qs('#td_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const s=qs('#td_start').value, e=qs('#td_end').value;
    const r=qs('#td_result'); r.classList.remove('hidden');
    if(!s||!e){ r.textContent='Enter both a start and end time.'; return; }
    let [sh,sm]=s.split(':').map(Number), [eh,em]=e.split(':').map(Number);
    let mins = (eh*60+em)-(sh*60+sm); if(mins<0) mins+=24*60;
    r.textContent = `${Math.floor(mins/60)}h ${mins%60}m`;
    consumeTrialCredit();
  });
  // Deposit calculator
  qs('#dep_calc').addEventListener('click', ()=>{
    if(isTrialLocked()){ openActivationModal(); return; }
    const amt=parseFloat(qs('#dep_amt').value)||0, pct=parseFloat(qs('#dep_pct').value)||0;
    const r=qs('#dep_result'); r.classList.remove('hidden');
    r.innerHTML = `Deposit due: ${money(amt*pct/100)} <div class="stat-sub mt-2">Remaining balance: ${money(amt*(1-pct/100))}</div>`;
    consumeTrialCredit();
  });
}
function countdownFullText(){
  if(!STATE.event.date) return 'Set your event date in Settings to see a countdown.';
  const d = daysBetween(todayISO(), STATE.event.date);
  if(d>0) return `${d} day${d===1?'':'s'} until ${escapeHtml(STATE.event.name||'your event')}`;
  if(d===0) return `Today is the day — ${escapeHtml(STATE.event.name||'your event')}!`;
  return `${escapeHtml(STATE.event.name||'Your event')} was ${Math.abs(d)} day${Math.abs(d)===1?'':'s'} ago.`;
}

function renderBackup(host){
  const lastBackup = APP.meta.lastFullBackupAt ? fmtDate(APP.meta.lastFullBackupAt.slice(0,10)) : null;
  const totalEvents = listEvents().length;
  host.innerHTML = `
    <div class="page-header"><div><h2>Backup & Restore</h2><div class="page-header-sub">Your data lives only on this device — back it up regularly</div></div></div>
    <div class="bento">
      <div class="card span-6">
        <div class="card-title">${icon('download')} Full Application Backup</div>
        <p class="tool-hint">Export every saved event (${totalEvents} event${totalEvents===1?'':'s'}) plus your app-wide preferences as one JSON file.</p>
        <button class="btn btn-primary mt-3" id="downloadBackupBtn">${icon('download')} Download Full Backup</button>
        <div class="stat-sub mt-3">${lastBackup? `Last full backup: ${lastBackup}` : "No full backup downloaded yet."}</div>
      </div>
      <div class="card span-6">
        <div class="card-title">${icon('backup')} Data Storage</div>
        <p class="tool-hint">Everything is stored privately in this browser, on this device — nothing is uploaded anywhere. Clearing your browser data or switching devices will lose it unless you've backed up.</p>
        <div class="stat-sub mt-3">${totalEvents} saved event${totalEvents===1?'':'s'}${STATE? ` · Current: ${STATE.guests.length} guests, ${STATE.tasks.length} tasks, ${STATE.vendors.length} vendors, ${STATE.expenses.length} expenses`:''}</div>
      </div>
      <div class="card span-6">
        <div class="card-title">${icon('upload')} Restore Backup</div>
        <p class="tool-hint">Select a Full Application Backup to replace your entire saved event collection, or a single Event Backup to import it as an additional event.</p>
        <input type="file" accept="application/json" id="restoreFileInput" class="hidden">
        <button class="btn mt-3" id="restoreBackupBtn">${icon('upload')} Choose Backup File</button>
        <div id="restoreError" class="stat-sub" style="color:var(--danger);margin-top:8px;display:none;"></div>
      </div>
      ${STATE? `<div class="card span-6">
        <div class="card-title">${icon('download')} This Event's Backup</div>
        <p class="tool-hint">Export only "${escapeHtml(STATE.event.name||'this event')}" — useful for archiving or transferring a single event.</p>
        <button class="btn mt-3" id="downloadThisEventBtn">${icon('download')} Download Event Backup</button>
      </div>`:''}
      <div class="card span-6">
        <div class="card-title" style="color:var(--danger)">${icon('alert')} Reset Application</div>
        <p class="tool-hint">Permanently erase ALL saved events and data from this device and start over. This cannot be undone.</p>
        <button class="btn btn-danger mt-3" id="resetAppBtn">${icon('trash')} Reset Application</button>
      </div>
    </div>
  `;
  qs('#downloadBackupBtn').addEventListener('click', ()=>{
    if(STATE) APP.events[STATE.id] = STATE;
    const blob = new Blob([JSON.stringify(APP,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download = `event-command-center-full-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    APP.meta.lastFullBackupAt = new Date().toISOString();
    saveAppData();
    toast('Full backup downloaded');
    renderBackup(host);
  });
  const dteBtn = qs('#downloadThisEventBtn'); if(dteBtn) dteBtn.addEventListener('click', ()=> downloadEventBackup(STATE));
  qs('#restoreBackupBtn').addEventListener('click', ()=> qs('#restoreFileInput').click());
  qs('#restoreFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const errBox = qs('#restoreError'); errBox.style.display='none';
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed && typeof parsed==='object' && parsed.events && parsed.globalSettings){
          confirmDialog('Restoring a full backup will replace your ENTIRE saved event collection with the one in this file. Continue?', ()=>{
            APP = migrateAppData(parsed);
            GSET = APP.globalSettings;
            STATE = (APP.activeEventId && APP.events[APP.activeEventId]) ? APP.events[APP.activeEventId] : null;
            saveAppData(); applyGlobalTheme();
            toast('Full backup restored');
            if(STATE){ currentView='event'; applyEventTheme(); renderShell(); } else { renderMyEvents(); }
          }, {title:'Restore Full Backup', okLabel:'Restore'});
        } else if(parsed && typeof parsed==='object' && parsed.event && Array.isArray(parsed.guests)){
          if(isEventCreationLocked()){ openActivationModal(`The free trial is limited to ${DEMO_EVENT_LIMIT} event. Enter your activation code to import additional events.`); return; }
          confirmDialog(`Import "${parsed.event.name||'this event'}" as a new saved event? Your existing events will not be affected.`, ()=>{
            const imported = migrateEvent(parsed);
            if(APP.events[imported.id]) imported.id = uid();
            imported.meta.lastOpenedAt = new Date().toISOString();
            APP.events[imported.id] = imported;
            if(DEMO_BUILD && !APP.license.activated) APP.license.eventsCreated++;
            saveAppData();
            toast('Event imported');
            renderMyEvents();
          }, {title:'Import Event Backup', okLabel:'Import Event'});
        } else {
          throw new Error('This file does not look like a valid Event Command Center backup.');
        }
      }catch(err){
        errBox.textContent = 'Could not restore: ' + err.message;
        errBox.style.display='block';
      }
    };
    reader.readAsText(file);
    e.target.value='';
  });
  qs('#resetAppBtn').addEventListener('click', ()=>{
    confirmDialog('This will permanently delete ALL saved events — guests, tasks, vendors, expenses, notes and settings — from this device. This action cannot be undone.', ()=>{
      localStorage.removeItem(STORAGE_KEY);
      APP = defaultAppData();
      GSET = APP.globalSettings;
      STATE = null;
      applyGlobalTheme();
      toast('Application reset');

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function highlightMatch(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx,idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}
function runSearch(q){
  if(!q || q.length<1) return {};
  const ql = q.toLowerCase();
  const results = {};
  results['Guests'] = STATE.guests.filter(g=> `${g.firstName} ${g.lastName} ${g.email}`.toLowerCase().includes(ql)).slice(0,5).map(g=>({title:`${g.firstName} ${g.lastName||''}`, sub:g.rsvp, icon:'guests', go:()=>{ goTab('guests'); setTimeout(()=>openGuestModal(g),80); }}));
  results['Tasks'] = STATE.tasks.filter(t=> t.title.toLowerCase().includes(ql)).slice(0,5).map(t=>({title:t.title, sub:t.status, icon:'tasks', go:()=>{ goTab('tasks'); setTimeout(()=>openTaskModal(t),80); }}));
  results['Vendors'] = STATE.vendors.filter(v=> v.name.toLowerCase().includes(ql)).slice(0,5).map(v=>({title:v.name, sub:v.type, icon:'vendors', go:()=>{ goTab('vendors'); setTimeout(()=>openVendorModal(v),80); }}));
  results['Expenses'] = STATE.expenses.filter(e=> e.name.toLowerCase().includes(ql)).slice(0,5).map(e=>({title:e.name, sub:e.category, icon:'budget', go:()=>{ goTab('budget'); setTimeout(()=>openExpenseModal(e),80); }}));
  results['Schedule'] = STATE.schedule.filter(x=> x.title.toLowerCase().includes(ql)).slice(0,5).map(x=>({title:x.title, sub:x.date?fmtDate(x.date):'', icon:'schedule', go:()=>{ goTab('schedule'); setTimeout(()=>openScheduleModal(x),80); }}));
  results['Notes'] = STATE.notes.filter(n=> (n.title+' '+n.content).toLowerCase().includes(ql)).slice(0,5).map(n=>({title:n.title, sub:n.category, icon:'notes', go:()=>{ goTab('notes'); setTimeout(()=>openNoteModal(n),80); }}));
  Object.keys(results).forEach(k=> { if(!results[k].length) delete results[k]; });
  return {results, q};
}
function openSearch(){
  pushOverlayState();
  const overlay = el(`<div class="search-overlay" id="searchOverlay">
    <div class="search-panel">
      <div class="search-input-row">${icon('search')}<input type="text" id="searchInput" placeholder="Search guests, tasks, vendors, expenses, schedule, notes…">
        <button class="search-clear-btn hidden" id="searchClearBtn" aria-label="Clear search">${icon('x')}</button>
        <button class="icon-btn" id="searchCloseBtn" aria-label="Close search">${icon('x')}</button></div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const input = qs('#searchInput',overlay);
  const clearBtn = qs('#searchClearBtn',overlay);
  input.focus();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSearch(); });
  qs('#searchCloseBtn',overlay).addEventListener('click', closeSearch);
  document.addEventListener('keydown', searchEscHandler);
  input.addEventListener('input', ()=>{ clearBtn.classList.toggle('hidden', !input.value); renderSearchResults(input.value); });
  clearBtn.addEventListener('click', ()=>{ input.value=''; clearBtn.classList.add('hidden'); renderSearchResults(''); input.focus(); });
  renderSearchResults('');
}
function searchEscHandler(e){ if(e.key==='Escape') closeSearch(); }
function closeSearch(){ const o=qs('#searchOverlay'); if(o) o.remove(); document.removeEventListener('keydown', searchEscHandler); }
function renderSearchResults(q){
  const box = qs('#searchResults'); if(!box) return;
  if(!q){ box.innerHTML = `<div class="stat-sub" style="padding:16px;text-align:center;">Type to search across your entire event.</div>`; return; }
  const {results} = runSearch(q);
  if(!results || !Object.keys(results).length){ box.innerHTML = `<div class="stat-sub" style="padding:16px;text-align:center;">No results for "${escapeHtml(q)}".</div>`; return; }
  box.innerHTML = Object.entries(results).map(([group,items])=>`
    <div class="search-group-label">${group}</div>
    ${items.map((it,i)=>`<div class="search-result" data-group="${group}" data-idx="${i}">
      <div class="search-result-icon">${icon(it.icon)}</div>
      <div><div class="search-result-title">${highlightMatch(it.title,q)}</div><div class="search-result-sub">${escapeHtml(it.sub||'')}</div></div>
    </div>`).join('')}
  `).join('');
  qsa('.search-result',box).forEach(r=>{
    r.addEventListener('click', ()=>{
      const {results} = runSearch(q);
      const item = results[r.dataset.group][+r.dataset.idx];
      closeSearch(); item.go();
    });
  });
}
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if(qs('#searchOverlay')) closeSearch(); else openSearch(); }
});
