<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6B5CE0" />
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Event Command Center">
<title>Event Command Center</title>
<style>
/* ============================================================
   CONFIG-DRIVEN CSS VARIABLES (base + per-event overrides via JS)
   ============================================================ */
:root{
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

  --primary:#6B5CE0;
  --secondary:#E7AFC1;
  --accent:#E3AC4E;
  --soft:#F3EEFB;
  --bg:#FAF9FC;

  --ink:#221F2E;
  --ink-muted:#635C74;
  --ink-faint:#9993A8;
  --surface:#FFFFFF;
  --surface-2:#F6F4FA;
  --border:#E7E3F0;
  --border-strong:#D6D0E6;

  --success:#2FA787;
  --warning:#E0A63B;
  --danger:#E0625A;
  --info:#4A8BF5;

  --shadow-sm:0 1px 2px rgba(34,31,46,.06);
  --shadow-md:0 6px 20px rgba(34,31,46,.08);
  --shadow-lg:0 16px 40px rgba(34,31,46,.14);

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
  --radius-pill:999px;

  color-scheme: light;
}

[data-theme="dark"]{
  --bg:#17151F;
  --surface:#1F1C2A;
  --surface-2:#252132;
  --ink:#F1EEF7;
  --ink-muted:#B6AFC7;
  --ink-faint:#847C99;
  --border:#332E44;
  --border-strong:#433C58;
  --soft:#282239;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.5);
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  transition:background .25s ease,color .25s ease;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
a{color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
::selection{background:var(--primary);color:#fff;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
/* Interactive elements: manipulation avoids the browser's tap-vs-scroll
   disambiguation delay/misfire on touch devices, and disables the
   double-tap-to-zoom gesture that can eat a first tap. */
button,[role="button"],.tab-btn,.cal-cell,.cal-event,.card[data-nav],
.list-row[data-clickrow],tr[data-rowclick],.event-type-card,.style-card,
.quick-action,.myevents-card,a,.icon-btn,.badge,input[type="checkbox"]{
  touch-action:manipulation;
}

.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* Scrollbars */
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{min-height:100vh;display:flex;flex-direction:column;}

/* ============================================================ TOP BAR ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:10px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.topbar-brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap;}
.topbar-brand .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.topbar-brand .brand-mark svg{width:17px;height:17px;color:#fff;}
.brand-logo{display:flex;align-items:center;height:28px;flex-shrink:0;}
.brand-logo img{height:100%;width:auto;display:block;}
.brand-logo img.brand-logo-dark{display:none;}
[data-theme="dark"] .brand-logo img.brand-logo-light{display:none;}
[data-theme="dark"] .brand-logo img.brand-logo-dark{display:block;}
.onboard-brand .brand-logo{height:34px;}
@media (max-width:340px){ .topbar-brand .brand-logo{height:20px;} }
.topbar-search{
  flex:1 1 auto;max-width:680px;min-width:160px;display:flex;align-items:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);
  padding:9px 15px;color:var(--ink-muted);cursor:pointer;transition:.15s;
}
.topbar-search:hover{border-color:var(--border-strong);background:var(--surface);}
.topbar-search:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.topbar-search svg{width:15px;height:15px;flex-shrink:0;}
.topbar-search-label{font-size:13.5px;flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-search kbd{font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-family:var(--font-ui);flex-shrink:0;}
.topbar-brand{flex:0 0 auto;}
.topbar-actions{flex:0 0 auto;}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.icon-btn{
  width:36px;height:36px;border-radius:var(--radius-pill);border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--ink-muted);transition:.15s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--border-strong);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:17px;height:17px;}

@media (max-width:680px){
  .topbar-search-label{display:none;}
  .topbar-search{max-width:none;min-width:0;flex:0 0 auto;padding:8px;}
  .topbar-search kbd{display:none;}
  .topbar-brand-label{display:none;}
  .myevents-btn-label{display:none;}
  .myevents-btn{padding:8px;gap:0;}
}

/* ============================================================ EVENT HERO ============================================================ */
.event-hero{
  position:relative;overflow:hidden;
  margin:16px 20px 0;border-radius:var(--radius-lg);
  background:var(--hero-gradient, linear-gradient(120deg,var(--soft),var(--surface)));
  border:1px solid var(--border);
  display:grid;grid-template-columns:1.6fr 1fr;min-height:220px;
}
.hero-info{padding:28px 32px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;z-index:2;}
.hero-eventtype{
  display:inline-flex;align-items:center;gap:6px;width:fit-content;max-width:100%;
  background:var(--primary);color:#fff;font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:var(--radius-pill);letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hero-title{font-size:clamp(24px,3.4vw,36px);line-height:1.1;color:var(--ink);}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-muted);font-size:13.5px;}
.hero-meta-item{display:flex;align-items:center;gap:6px;}
.hero-meta-item svg{width:14px;height:14px;flex-shrink:0;color:var(--primary);}
.hero-countdown{
  display:inline-flex;align-items:center;gap:8px;width:fit-content;margin-top:2px;
  background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-sm);
  padding:8px 16px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;color:var(--primary);
}
.hero-artwork{position:relative;min-height:200px;}
.hero-artwork svg{position:absolute;inset:0;width:100%;height:100%;}
.hero-edit-btn{
  position:absolute;top:16px;right:16px;z-index:3;display:flex;gap:8px;
}
.hero-edit-btn button{
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
  border-radius:var(--radius-pill);padding:7px 14px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-muted);transition:.15s;
}
.hero-edit-btn button:hover{color:var(--ink);border-color:var(--border-strong);}
.hero-edit-btn button svg{width:13px;height:13px;}
.hero-edit-btn .hero-menu-btn{padding:7px 9px;}
.hero-menu-wrap{position:relative;}
.hero-menu{
  position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);
  padding:6px;z-index:10;
}
.hero-menu-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--radius-sm);
  border:none;background:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
.hero-menu-item svg{width:14px;height:14px;color:var(--ink-muted);}
.hero-menu-item:hover{background:var(--surface-2);}
.hero-menu-item.danger{color:var(--danger);}
.hero-menu-item.danger svg{color:var(--danger);}

.myevents-btn{
  display:flex;align-items:center;gap:5px;flex-shrink:0;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);
  padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--ink-muted);cursor:pointer;transition:.15s;
}
.myevents-btn svg{width:13px;height:13px;}
.myevents-btn:hover{color:var(--ink);border-color:var(--border-strong);background:var(--surface);}

/* My Events home screen */
.myevents-page{width:100%;max-width:1400px;margin:0 auto;padding:22px 20px 50px;}
.myevents-summary{color:var(--ink-muted);font-size:13px;}
.myevents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:18px;}
@media (max-width:680px){.myevents-grid{grid-template-columns:1fr;}}
.myevents-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:visible;
  box-shadow:var(--shadow-sm);transition:box-shadow .15s ease, transform .15s ease;display:flex;flex-direction:column;
}
.myevents-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.myevents-card-art{position:relative;height:110px;background:linear-gradient(120deg,var(--card-soft,var(--soft)),var(--surface) 80%);overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.myevents-card-art svg{position:absolute;inset:0;width:100%;height:100%;}
.myevents-card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.myevents-card-body h3{font-size:16px;line-height:1.25;}
.myevents-card-stats{font-size:12px;color:var(--ink-muted);}
.myevents-card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.myevents-create-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);min-height:230px;
  cursor:pointer;color:var(--ink-muted);transition:.15s;background:var(--surface-2);
}
.myevents-create-card:hover{border-color:var(--primary);color:var(--primary);background:var(--soft);}
.myevents-create-card .qa-icon{width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;}
.myevents-create-card .qa-icon svg{width:19px;height:19px;}
.myevents-create-card span.ce-label{font-size:13.5px;font-weight:700;}

@media (max-width:900px){
  .event-hero{grid-template-columns:1fr;}
  .hero-artwork{min-height:120px;order:-1;opacity:.9;}
  .hero-info{padding:22px 20px;}
}
@media (max-width:900px){
  .event-hero{margin:12px 12px 0;}
}

/* ============================================================ TABS ============================================================ */
.tabbar-wrap{
  position:sticky;top:57px;z-index:35;background:var(--bg);
  padding:14px 20px 0;
}
.tabbar{
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  border-bottom:1px solid var(--border);
}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0;display:flex;align-items:center;gap:7px;
  padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--ink-muted);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.tab-btn svg{width:15px;height:15px;}
.tab-btn:hover{color:var(--ink);}
.tab-btn:active{opacity:.8;}
.tab-btn:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;border-radius:6px;}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

/* ============================================================ LAYOUT / CONTENT ============================================================ */
.content{padding:20px;max-width:1400px;width:100%;margin:0 auto;flex:1;}
.page{display:none;animation:fadeIn .2s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.page-header h2{font-size:22px;}
.page-header-sub{color:var(--ink-muted);font-size:13.5px;margin-top:2px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:10px 16px;border-radius:var(--radius-md);font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s;
}
.btn svg{width:15px;height:15px;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Cards / grid */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
.card[data-nav]{cursor:pointer;}
.card[data-nav]:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border-strong);}
.card[data-nav]:active{transform:translateY(0);}
.grid{display:grid;gap:14px;}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
.span-3{grid-column:span 3;}.span-4{grid-column:span 4;}.span-5{grid-column:span 5;}
.span-6{grid-column:span 6;}.span-7{grid-column:span 7;}.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}
@media (max-width:1050px){
  .bento .span-3,.bento .span-4,.bento .span-5,.bento .span-6,.bento .span-7,.bento .span-8{grid-column:span 6;}
}
@media (max-width:680px){
  .bento .span-3,.bento .span-4,.bento .span-5,.bento .span-6,.bento .span-7,.bento .span-8{grid-column:span 12;}
}

.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-label{font-size:12.5px;color:var(--ink-muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.stat-label svg{width:14px;height:14px;color:var(--primary);}
.stat-value{font-size:26px;font-family:var(--font-display);font-weight:700;}
.stat-sub{font-size:12px;color:var(--ink-faint);}

.progress-track{width:100%;height:8px;border-radius:var(--radius-pill);background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:var(--radius-pill);transition:width .4s ease;}

.card-title{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.card-title a{margin-left:auto;font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;}

/* Lists */
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.list-row[data-clickrow]{cursor:pointer;border-radius:8px;margin:0 -8px;padding:9px 8px;transition:background .12s;}
.list-row[data-clickrow]:hover{background:var(--surface-2);}
.list-row:last-child{border-bottom:none;}
.list-row-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row-meta{color:var(--ink-muted);font-size:12px;white-space:nowrap;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;}
.badge-primary{background:var(--soft);color:var(--primary);}
.badge-success{background:rgba(47,167,135,.13);color:var(--success);}
.badge-warning{background:rgba(224,166,59,.15);color:var(--warning);}
.badge-danger{background:rgba(224,98,90,.13);color:var(--danger);}
.badge-info{background:rgba(74,139,245,.13);color:var(--info);}
.badge-muted{background:var(--surface-2);color:var(--ink-muted);}

/* Quick actions */
.quick-actions{display:flex;gap:10px;flex-wrap:wrap;}
.quick-action{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding:14px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);
  cursor:pointer;flex:1;min-width:130px;transition:.15s;
}
.quick-action:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);}
.quick-action .qa-icon{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;}
.quick-action .qa-icon svg{width:16px;height:16px;}
.quick-action span{font-size:12.5px;font-weight:600;}

/* Toolbar (search/filter rows) */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar .input-wrap{position:relative;flex:1;min-width:180px;}
.toolbar input[type="text"],.toolbar input[type="search"]{width:100%;padding:9px 12px 9px 32px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);color:var(--ink);}
.toolbar .input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint);}
select,.select{padding:9px 10px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;}

/* Table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
tr[data-rowclick]{cursor:pointer;}
th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--ink-muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.row-actions{display:flex;gap:6px;}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:50px 20px;color:var(--ink-muted);}
.empty-state .es-icon{width:52px;height:52px;border-radius:16px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;}
.empty-state .es-icon svg{width:24px;height:24px;}
.empty-state h4{color:var(--ink);font-size:15px;}
.empty-state p{font-size:13px;max-width:280px;}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-muted);}
.field label .req{color:var(--danger);}
.field input,.field select,.field textarea{
  padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink);width:100%;
}
.field textarea{resize:vertical;min-height:70px;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}
.field-error{font-size:11.5px;color:var(--danger);display:none;}
.field.invalid .field-error{display:block;}
.custom-inline{margin-top:6px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,17,30,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-header h3{font-size:16.5px;}
.modal-body{padding:22px;overflow-y:auto;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}
.modal.modal-sm{max-width:420px;}

/* Toasts */
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;pointer-events:none;}
@media (max-width:520px){.toast-stack{left:12px;right:12px;bottom:12px;max-width:none;}}
.toast{
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;
  pointer-events:none;
}
[data-theme="dark"] .toast{background:var(--surface-2);border:1px solid var(--border-strong);}
.toast svg{width:15px;height:15px;flex-shrink:0;}
.toast.toast-danger{background:var(--danger);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Search overlay */
.search-overlay{position:fixed;inset:0;background:rgba(20,17,30,.45);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 20px;}
.search-panel{width:100%;max-width:600px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);max-height:70vh;display:flex;flex-direction:column;overflow:hidden;}
.search-input-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);}
.search-input-row svg{width:17px;height:17px;color:var(--ink-faint);flex-shrink:0;}
.search-input-row input{flex:1;border:none;background:none;font-size:15px;color:var(--ink);outline:none;}
.search-clear-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface-2);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.search-clear-btn svg{width:12px;height:12px;}
.search-clear-btn:hover{background:var(--border);}
.search-results{overflow-y:auto;padding:8px;}
.search-group-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-faint);padding:10px 10px 4px;}
.search-result{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);cursor:pointer;}
.search-result:hover{background:var(--surface-2);}
.search-result-icon{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.search-result-icon svg{width:14px;height:14px;}
.search-result-title{font-size:13px;font-weight:600;}
.search-result-sub{font-size:11.5px;color:var(--ink-muted);}
mark{background:var(--accent);color:#221F2E;border-radius:3px;padding:0 2px;}

/* Onboarding */
.onboard-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;}
.onboard-wrap{max-width:640px;margin:0 auto;padding:40px 20px 60px;}
.onboard-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
.onboard-brand .brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;}
.onboard-brand .brand-mark svg{width:20px;height:20px;color:#fff;}
.onboard-brand span{font-family:var(--font-display);font-weight:700;font-size:19px;}
.event-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
@media (max-width:560px){.event-type-grid{grid-template-columns:repeat(2,1fr);}}
.event-type-card{
  position:relative;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:18px 12px 14px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.event-type-card .et-icon-badge{width:44px;height:44px;border-radius:14px;background:var(--et-soft,var(--soft));color:var(--et-color,var(--primary));display:flex;align-items:center;justify-content:center;transition:.15s;}
.event-type-card .et-icon-badge svg{width:23px;height:23px;}
.event-type-card span.et-label{font-size:12.5px;font-weight:700;}
.event-type-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.event-type-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.event-type-card.selected{border-color:var(--et-color,var(--primary));background:var(--et-soft,var(--soft));box-shadow:var(--shadow-md);}
.event-type-card.selected .et-icon-badge{background:var(--et-color,var(--primary));color:#fff;}
.et-check{position:absolute;top:8px;right:8px;width:19px;height:19px;border-radius:50%;background:var(--et-color,var(--primary));color:#fff;display:none;align-items:center;justify-content:center;animation:popIn .15s ease;}
.et-check svg{width:11px;height:11px;}
.event-type-card.selected .et-check{display:flex;}
@keyframes popIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.style-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:560px){.style-grid{grid-template-columns:repeat(2,1fr);}}
.style-card{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);transition:.15s;}
.style-card svg{width:17px;height:17px;}
.style-card span{font-size:11px;font-weight:700;}
.style-card:hover{border-color:var(--border-strong);}
.style-card.selected{border-color:var(--st-color,var(--primary));background:var(--st-soft,var(--soft));color:var(--st-color,var(--primary));}
.et-more-toggle{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--primary);cursor:pointer;background:none;border:none;display:flex;align-items:center;gap:5px;}

.step-dots{display:flex;gap:6px;margin-bottom:18px;}
.step-dots span{width:22px;height:4px;border-radius:2px;background:var(--border);}
.step-dots span.active{background:var(--primary);}

/* helper */
.text-muted{color:var(--ink-muted);}
.mt-2{margin-top:8px;}
.mt-3{margin-top:14px;}
.flex{display:flex;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.gap-8{gap:8px;}

/* Calendar */
.cal-month-label{font-weight:700;min-width:150px;text-align:center;display:inline-block;}
@media (max-width:340px){ .cal-month-label{min-width:110px;font-size:13px;} }
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11px;font-weight:700;color:var(--ink-faint);text-align:center;padding:4px 0;}
.cal-cell{min-height:78px;border:1px solid var(--border);border-radius:10px;padding:6px;font-size:11px;background:var(--surface);cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.cal-cell:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);}
.cal-cell:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.cal-cell.other-month{cursor:default;}
.cal-cell.other-month:hover{border-color:var(--border);box-shadow:none;}
.cal-cell.today{border-color:var(--primary);border-width:1.5px;}
.cal-cell.other-month{opacity:.35;}
.cal-daynum{font-weight:700;font-size:12px;margin-bottom:3px;}
.cal-event{background:var(--soft);color:var(--primary);border-radius:5px;padding:2px 5px;margin-bottom:2px;font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
@media (max-width:680px){.cal-cell{min-height:52px;font-size:10px;}}

/* Smart tools */
.tool-card{display:flex;flex-direction:column;gap:10px;}
.tool-result{background:var(--soft);border-radius:var(--radius-sm);padding:12px 14px;font-weight:700;color:var(--primary);font-size:15px;}
.tool-hint{font-size:12px;color:var(--ink-muted);}

footer.app-footer{text-align:center;padding:26px 20px;color:var(--ink-faint);font-size:11.5px;}
</style>
</head>

     demo (GitHub Pages): DEMO_BUILD=true,  SEED_WITH_SAMPLE_DATA=false
     marketing build   : DEMO_BUILD=false, SEED_WITH_SAMPLE_DATA=true
   ============================================================ */
const DEMO_BUILD = true;

const SCHEMA_VERSION = 2;
const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function defaultGlobalSettings(){
  return {
    theme:'light', dateFormat:'MMM D, YYYY', timeFormat:'12h',
    dashboardWidgets:{overview:true, countdown:true, progress:true, rsvp:true, budget:true, tasks:true, scheduleUp:true, vendors:true, payments:true, quickActions:true, activity:true}
  };
}
/* One saved Event's own independent data — this is what STATE points to
   while an event is open. */
function defaultEvent(){
  return {
    id: null,
    schemaVersion: SCHEMA_VERSION,
    meta:{ createdAt:new Date().toISOString(), lastOpenedAt:new Date().toISOString() },
    event:{
      name:'', type:'', customTypeLabel:'', mood:'elegant',
      date:'', organizer:'', venue:'', totalBudget:0, currency:'USD', guestCount:0,
      visualMode:'auto', customCoverImage:null
    },
    guests:[], tasks:[], schedule:[], vendors:[], expenses:[], notes:[],
    customValues:{ eventType:[], taskCategory:[], vendorType:[], expenseCategory:[], guestGroup:[], noteCategory:[] },
    activity:[]
  };
}
function migrateEvent(raw){
  const def = defaultEvent();
  if(!raw || typeof raw!=='object') return def;
  const s = Object.assign({}, def, raw);
  s.event = Object.assign({}, def.event, raw.event||{});
  s.customValues = Object.assign({}, def.customValues, raw.customValues||{});
  s.meta = Object.assign({}, def.meta, raw.meta||{});
  ['guests','tasks','schedule','vendors','expenses','notes','activity'].forEach(k=>{ s[k] = Array.isArray(raw[k]) ? raw[k] : []; });
  s.schemaVersion = SCHEMA_VERSION;
  if(!s.id) s.id = uid();
  return s;
}

/* Top-level app data: every saved event, which one is active, and
   settings that apply across all events (appearance, formats, widgets). */
function defaultAppData(){
  return { schemaVersion: SCHEMA_VERSION, activeEventId:null, events:{}, globalSettings: defaultGlobalSettings(), meta:{lastFullBackupAt:null}, license:{activated:false, trialCreditsUsed:0, eventsCreated:0} };
}
function migrateAppData(raw){
  const def = defaultAppData();
  if(!raw || typeof raw!=='object') return def;
  const out = Object.assign({}, def, raw);
  out.globalSettings = Object.assign({}, def.globalSettings, raw.globalSettings||{});
  out.globalSettings.dashboardWidgets = Object.assign({}, def.globalSettings.dashboardWidgets, (raw.globalSettings&&raw.globalSettings.dashboardWidgets)||{});
  out.meta = Object.assign({}, def.meta, raw.meta||{});
  out.license = Object.assign({}, def.license, raw.license||{});
  out.events = {};
  Object.keys(raw.events||{}).forEach(id=>{ out.events[id] = migrateEvent(raw.events[id]); out.events[id].id = id; });
  out.schemaVersion = SCHEMA_VERSION;
  return out;
}

/* ============================================================

   marketing builds have DEMO_BUILD=false and are always unlocked)
   ============================================================ */
function isTrialLocked(){
  return DEMO_BUILD && !APP.license.activated && APP.license.trialCreditsUsed >= TRIAL_LIMIT;
}
function trialCreditsRemaining(){
  return Math.max(0, TRIAL_LIMIT - APP.license.trialCreditsUsed);
}
function consumeTrialCredit(){
  if(!DEMO_BUILD || APP.license.activated) return;
  APP.license.trialCreditsUsed++;
  saveAppData();
}
const DEMO_EVENT_LIMIT = 1;
function isEventCreationLocked(){
  return DEMO_BUILD && !APP.license.activated && APP.license.eventsCreated >= DEMO_EVENT_LIMIT;
}
function activateWithCode(code){
  const clean = String(code||'').trim().toUpperCase();
  if(VALID_ACTIVATION_CODES.includes(clean)){
    APP.license.activated = true;
    saveAppData();
    return true;
  }
  return false;
}
function openActivationModal(reason){
  const msg = reason || `You've used all ${TRIAL_LIMIT} free items in this trial. Enter your activation code to unlock unlimited guests, tasks, vendors, expenses and Smart Tools calculations.`;
  openModal({
    title:'Unlock Full Version',
    small:true,
    bodyHtml:`
      <p style="font-size:13.5px;color:var(--ink-muted);margin-bottom:14px;">${msg}</p>
      <div class="field"><label>Activation Code</label><input id="actCodeInput" placeholder="XXXX-XXXX-XXXX" style="text-transform:uppercase;letter-spacing:.04em;"></div>
      <div id="actCodeError" class="field-error" style="display:none;margin-top:6px;">That code isn't valid. Please check it and try again.</div>
    `,
    footerHtml:`<button class="btn" id="actCancel">Not Now</button><button class="btn btn-primary" id="actSubmit">${icon('check')} Activate</button>`,
    onMount:(o)=>{
      qs('#actCancel',o).addEventListener('click', closeModal);
      const submit = ()=>{
        const val = qs('#actCodeInput',o).value;
        if(activateWithCode(val)){
          closeModal();
          toast('Full version unlocked — thank you!');
          if(currentView==='event') refreshCurrentTab(); else renderMyEvents();
        } else {
          qs('#actCodeError',o).style.display='block';
        }
      };
      qs('#actSubmit',o).addEventListener('click', submit);
      qs('#actCodeInput',o).addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    }
  });
}
/* Safe one-time migration: an older single-event install becomes the
   first entry in the new multi-event collection, with a real ID and
   its old appearance/format settings promoted to globalSettings. */
function migrateLegacySingleEvent(rawLegacy){
  const ev = migrateEvent(rawLegacy);
  ev.id = uid();
  ev.meta.createdAt = (rawLegacy.meta && rawLegacy.meta.createdAt) || new Date().toISOString();
  ev.meta.lastOpenedAt = new Date().toISOString();
  const app = defaultAppData();
  app.events[ev.id] = ev;
  app.activeEventId = ev.id;
  if(rawLegacy.settings){
    app.globalSettings = Object.assign({}, app.globalSettings, {
      theme: rawLegacy.settings.theme || 'light',
      dateFormat: rawLegacy.settings.dateFormat || 'MMM D, YYYY',
      timeFormat: rawLegacy.settings.timeFormat || '12h',
      dashboardWidgets: Object.assign({}, app.globalSettings.dashboardWidgets, rawLegacy.settings.dashboardWidgets||{})
    });
  }
  return app;
}

let APP = null;    // {schemaVersion, activeEventId, events:{id:eventObj}, globalSettings}
let STATE = null;  // alias for the currently open event (APP.events[APP.activeEventId]), or null on My Events
let GSET = null;   // alias for APP.globalSettings

function loadAppData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      APP = migrateAppData(JSON.parse(raw));
    } else {
      const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if(legacyRaw){
        APP = migrateLegacySingleEvent(JSON.parse(legacyRaw));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(APP));
      } else {
        APP = defaultAppData();
      }
    }
  }catch(e){
    console.warn('App data load failed, starting fresh.', e);
    APP = defaultAppData();
  }
  GSET = APP.globalSettings;
  STATE = (APP.activeEventId && APP.events[APP.activeEventId]) ? APP.events[APP.activeEventId] : null;
  return APP;
}
function saveAppData(){
  try{
    if(STATE) APP.events[STATE.id] = STATE;
    APP.globalSettings = GSET;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(APP));
    return true;
  }catch(e){
    console.warn('Storage unavailable', e);
    toast('Could not save — your browser storage may be full or disabled.', 'danger');
    return false;
  }
}
// Kept as the name used throughout the app for "persist now".
function saveState(){ return saveAppData(); }
function logActivity(text){
  if(!STATE) return;
  STATE.activity.unshift({id:uid(), text, at:new Date().toISOString()});
  STATE.activity = STATE.activity.slice(0,30);
}

/* ============================================================
   EVENT COLLECTION MANAGEMENT (My Events)
   ============================================================ */
function listEvents(){ return Object.values(APP.events); }
function createEvent(details){
  const ev = defaultEvent();
  ev.id = uid();
  Object.assign(ev.event, details);
  ev.meta.createdAt = new Date().toISOString();
  ev.meta.lastOpenedAt = new Date().toISOString();
  APP.events[ev.id] = ev;
  APP.activeEventId = ev.id;
  STATE = ev;
  if(DEMO_BUILD && !APP.license.activated) APP.license.eventsCreated++;
  saveAppData();
  return ev;
}
function openEvent(id){
  const ev = APP.events[id]; if(!ev) return null;
  ev.meta.lastOpenedAt = new Date().toISOString();
  APP.activeEventId = id;
  STATE = ev;
  saveAppData();
  return ev;
}
function duplicateEvent(id){
  if(isEventCreationLocked()) return 'LOCKED';
  const src = APP.events[id]; if(!src) return null;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.event.name = (src.event.name||'Untitled Event') + ' — Copy';
  copy.meta.createdAt = new Date().toISOString();
  copy.meta.lastOpenedAt = new Date().toISOString();
  APP.events[copy.id] = copy;
  if(DEMO_BUILD && !APP.license.activated) APP.license.eventsCreated++;
  saveAppData();
  return copy;
}
function deleteEvent(id){
  delete APP.events[id];
  if(APP.activeEventId===id){ APP.activeEventId=null; STATE=null; }
  saveAppData();
}
function goToMyEvents(){
  if(STATE) saveState();
  currentView = 'myevents';
  renderMyEvents();
  pushNavState({view:'myevents'});
}

/* ============================================================
   BROWSER HISTORY / BACK-BUTTON SUPPORT
   The app is a single page, so without this, the phone/browser
   back button exits the page entirely instead of stepping back
   through My Events -> Event -> modal like a normal app.
   ============================================================ */
function pushNavState(state){ try{ history.pushState(state, ''); }catch(e){} }
function replaceNavState(state){ try{ history.replaceState(state, ''); }catch(e){} }
function pushOverlayState(){ try{ history.pushState({overlay:true}, ''); }catch(e){} }
window.addEventListener('popstate', (e)=>{
  const modalOpen = document.getElementById('activeModalOverlay');
  const searchOpen = document.getElementById('searchOverlay');
  const onboardOpen = document.getElementById('onboardOverlay');
  if(modalOpen){ closeModal(); return; }
  if(searchOpen){ closeSearch(); return; }
  if(onboardOpen && currentView==='myevents'){ onboardOpen.remove(); return; }
  const state = e.state;
  if(state && state.view==='myevents'){
    if(STATE) saveState();
    currentView = 'myevents';
    renderMyEvents();
  } else if(state && state.view==='event' && state.eventId && APP.events[state.eventId]){
    openEvent(state.eventId);
    CURRENT_TAB = 'dashboard';
    applyEventTheme();
    renderShell();
  } else {
    // Unrecognized/initial state (e.g. stepped back past the very first
    // event ever created, which skipped My Events entirely) — normalize
    // to whichever screen actually makes sense right now.
    if(listEvents().length===0){ renderOnboarding({allowCancel:false}); }
    else { if(STATE) saveState(); currentView='myevents'; renderMyEvents(); }
  }
  // A popped {overlay:true} entry with nothing open is a harmless leftover
  // from an overlay that was already closed explicitly — nothing to do.
});

const CURRENCY_SYMBOLS = {USD:'$',EUR:'€',GBP:'£',MAD:'DH',CAD:'$',AUD:'$',AED:'د.إ',SAR:'﷼',JPY:'¥'};
function money(n){
  n = Number(n)||0;
  const sym = CURRENCY_SYMBOLS[STATE.event.currency] || (STATE.event.currency? STATE.event.currency+' ':'$');
  const formatted = Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'') + sym + formatted;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  const fmt = GSET.dateFormat;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const M=months[dt.getMonth()], D=dt.getDate(), Y=dt.getFullYear();
  if(fmt==='D/M/YYYY') return `${D}/${dt.getMonth()+1}/${Y}`;
  if(fmt==='M/D/YYYY') return `${dt.getMonth()+1}/${D}/${Y}`;
  return `${M} ${D}, ${Y}`;
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  if(GSET.timeFormat==='24h') return t;
  const hh = h%12===0?12:h%12;
  return `${hh}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function qs(sel,ctx){ return (ctx||document).querySelector(sel); }
function qsa(sel,ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ const A=new Date(a+'T00:00:00'),B=new Date(b+'T00:00:00'); return Math.round((B-A)/86400000); }
function activeEventTypeLabel(ev){
  ev = ev || STATE;
  if(ev.event.type==='other') return ev.event.customTypeLabel || 'Custom Event';
  return (EVENT_VISUAL_PROFILES[ev.event.type]||{}).label || 'Event';
}
function currentProfile(ev){
  ev = ev || STATE;
  const t = ev.event.type;
  const base = EVENT_VISUAL_PROFILES[t] || EVENT_VISUAL_PROFILES.other;
  if(t==='other'){
    const mood = MOOD_PRESETS[ev.event.mood] || MOOD_PRESETS.elegant;
    return Object.assign({}, base, mood);
  }
  return base;
}

/* ============================================================
   TOASTS
   ============================================================ */
function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const t = el(`<div class="toast ${type==='danger'?'toast-danger':''}">${icon(type==='danger'?'alert':'check')}<span></span></div>`);
  t.querySelector('span').textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),250); }, 2800);
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal({title, bodyHtml, footerHtml, onMount, small}){
  closeModal();
  pushOverlayState();
  const overlay = el(`<div class="modal-overlay" id="activeModalOverlay">
    <div class="modal ${small?'modal-sm':''}" role="dialog" aria-modal="true">
      <div class="modal-header"><h3>${escapeHtml(title)}</h3><button class="icon-btn" id="modalCloseBtn" aria-label="Close">${icon('x')}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml? `<div class="modal-footer">${footerHtml}</div>`:''}
    </div>
  </div>`);
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.addEventListener('keydown', escCloseHandler);
  if(onMount) onMount(overlay);
}
function escCloseHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const o = document.getElementById('activeModalOverlay');
  if(o) o.remove();
  document.removeEventListener('keydown', escCloseHandler);
}
function confirmDialog(message, onConfirm, opts){
  opts = opts||{};
  openModal({
    title: opts.title || 'Are you sure?',
    small:true,
    bodyHtml: `<p style="font-size:13.5px;color:var(--ink-muted)">${escapeHtml(message)}</p>`,
    footerHtml: `<button class="btn" id="cdCancel">Cancel</button><button class="btn btn-danger" id="cdOk">${escapeHtml(opts.okLabel||'Delete')}</button>`,
    onMount:(o)=>{
      qs('#cdCancel',o).addEventListener('click', closeModal);
      qs('#cdOk',o).addEventListener('click', ()=>{ closeModal(); onConfirm(); });
    }
  });
}

/* ============================================================
   FORM VALIDATION HELPERS
   ============================================================ */
function validateForm(form){
  let firstInvalid=null, valid=true;
  qsa('[data-required]', form).forEach(field=>{
    const input = field.querySelector('input,select,textarea');
    const wrap = field;
    const val = input? String(input.value||'').trim() : '';
    if(!val){
      valid=false; wrap.classList.add('invalid');
      if(!firstInvalid) firstInvalid=input;
    } else {
      wrap.classList.remove('invalid');
    }
  });
  if(firstInvalid){ firstInvalid.focus(); firstInvalid.scrollIntoView({behavior:'smooth', block:'center'}); }
  return valid;
}
function customSelectHtml(id, options, selected, allowCustom, customStoreKey){
  let opts = options.map(o=>`<option value="${escapeHtml(o)}" ${o===selected?'selected':''}>${escapeHtml(o)}</option>`).join('');
  if(customStoreKey){
    (STATE.customValues[customStoreKey]||[]).forEach(v=>{
      if(!options.includes(v)) opts += `<option value="${escapeHtml(v)}" ${v===selected?'selected':''}>${escapeHtml(v)}</option>`;
    });
  }
  const isCustomSelected = selected && !options.includes(selected) && customStoreKey && (STATE.customValues[customStoreKey]||[]).includes(selected);
  opts += `<option value="__custom__" ${selected==='__custom__'?'selected':''}>+ Other / Custom…</option>`;
  return `<select id="${id}">${opts}</select>
    <input type="text" id="${id}_custom" class="custom-inline hidden" placeholder="Enter custom value" value="${isCustomSelected?escapeHtml(selected):''}">`;
}
function wireCustomSelect(id){
  const sel = document.getElementById(id), custom = document.getElementById(id+'_custom');
  if(!sel||!custom) return;
  const sync = ()=>{ custom.classList.toggle('hidden', sel.value!=='__custom__'); };
  sel.addEventListener('change', sync); sync();
}
function readCustomSelect(id, storeKey){
  const sel = document.getElementById(id), custom = document.getElementById(id+'_custom');
  let val = sel.value;
  if(val==='__custom__'){
    val = (custom.value||'').trim() || 'Other';
    if(storeKey && val && !STATE.customValues[storeKey].includes(val)) STATE.customValues[storeKey].push(val);
  }
  return val;
}

function applyEventTheme(){
  if(!STATE){ applyGlobalTheme(); return; }
  const p = currentProfile();
  const root = document.documentElement;
  root.style.setProperty('--primary', p.primary);
  root.style.setProperty('--secondary', p.secondary);
  root.style.setProperty('--accent', p.accent);
  root.style.setProperty('--soft', p.soft);
  const dark = GSET.theme==='dark';
  root.setAttribute('data-theme', dark?'dark':'light');
  root.style.setProperty('--hero-gradient', dark
    ? `linear-gradient(120deg, ${p.primary}22, var(--surface) 65%)`
    : `linear-gradient(120deg, ${p.soft}, ${p.bg||'var(--surface)'} 70%)`);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content', p.primary));
}
function applyGlobalTheme(){
  const root = document.documentElement;
  const dark = GSET.theme==='dark';
  root.setAttribute('data-theme', dark?'dark':'light');
  const p = EVENT_VISUAL_PROFILES.other;
  root.style.setProperty('--primary', p.primary);
  root.style.setProperty('--secondary', p.secondary);
  root.style.setProperty('--accent', p.accent);
  root.style.setProperty('--soft', p.soft);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content', p.primary));
}

/* ============================================================
   MY EVENTS — home screen for the saved event collection
   ============================================================ */
let myEventsQuery = '';
let myEventsSort = 'recent';   // recent | upcoming | date | name
let myEventsFilter = '';       // '' | upcoming | today | completed
let openCardMenuId = null;

function eventStatus(ev){
  if(!ev.event.date) return {label:'No date set', kind:'muted'};
  const d = daysBetween(todayISO(), ev.event.date);
  if(d>0) return {label:`${d} Day${d===1?'':'s'} To Go`, kind:'upcoming'};
  if(d===0) return {label:'Event Today', kind:'today'};
  return {label:`Completed ${Math.abs(d)} day${Math.abs(d)===1?'':'s'} ago`, kind:'completed'};
}

function renderMyEvents(){
  currentView = 'myevents';
  applyGlobalTheme();
  const app = document.getElementById('app');
  let events = listEvents();
  const total = events.length;
  const upcomingCount = events.filter(e=> e.event.date && daysBetween(todayISO(), e.event.date) >= 0).length;
  const completedCount = events.filter(e=> e.event.date && daysBetween(todayISO(), e.event.date) < 0).length;

  if(myEventsQuery){
    const q = myEventsQuery.toLowerCase();
    events = events.filter(e=> `${e.event.name} ${activeEventTypeLabel(e)} ${e.event.venue} ${e.event.organizer}`.toLowerCase().includes(q));
  }
  if(myEventsFilter){
    events = events.filter(e=>{
      const st = eventStatus(e).kind;
      if(myEventsFilter==='upcoming') return st==='upcoming'||st==='today';
      if(myEventsFilter==='today') return st==='today';
      if(myEventsFilter==='completed') return st==='completed';
      return true;
    });
  }
  events.sort((a,b)=>{
    if(myEventsSort==='name') return (a.event.name||'').localeCompare(b.event.name||'');
    if(myEventsSort==='date') return (a.event.date||'9999').localeCompare(b.event.date||'9999');
    if(myEventsSort==='upcoming'){
      const da = a.event.date? daysBetween(todayISO(),a.event.date):99999;
      const db = b.event.date? daysBetween(todayISO(),b.event.date):99999;
      return (da<0?99999-da:da) - (db<0?99999-db:db);
    }
    return (b.meta.lastOpenedAt||'').localeCompare(a.meta.lastOpenedAt||''); // recent
  });

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-brand">${brandLogoHtml()}</div>
      <div class="topbar-actions" style="margin-left:auto;">
        <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle dark mode"></button>
      </div>
    </div>
    <div class="myevents-page">
      <div class="page-header">
        <div><h2>My Events</h2><div class="myevents-summary">${total} Event${total===1?'':'s'} · ${upcomingCount} Upcoming · ${completedCount} Completed</div></div>
      </div>
      ${total>1 ? `<div class="toolbar">
        <div class="input-wrap">${icon('search')}<input type="text" id="meQ" placeholder="Search by name, type, venue, organizer…" value="${escapeHtml(myEventsQuery)}"></div>
        <select id="meSort">
          <option value="recent" ${myEventsSort==='recent'?'selected':''}>Recently Opened</option>
          <option value="upcoming" ${myEventsSort==='upcoming'?'selected':''}>Upcoming First</option>
          <option value="date" ${myEventsSort==='date'?'selected':''}>Event Date</option>
          <option value="name" ${myEventsSort==='name'?'selected':''}>Event Name</option>
        </select>
        <select id="meFilter">
          <option value="">All Events</option>
          <option value="upcoming" ${myEventsFilter==='upcoming'?'selected':''}>Upcoming</option>
          <option value="today" ${myEventsFilter==='today'?'selected':''}>Today</option>
          <option value="completed" ${myEventsFilter==='completed'?'selected':''}>Completed</option>
        </select>
      </div>`:''}
      <div class="myevents-grid">
        ${events.map(renderEventCardHtml).join('')}
        <div class="myevents-create-card" id="createEventCard" tabindex="0" role="button">
          <span class="qa-icon">${icon('plus')}</span>
          <span class="ce-label">Create New Event</span>
        </div>
      </div>
      ${(total>0 && events.length===0) ? `<div class="empty-state"><div class="es-icon">${icon('search')}</div><h4>No events match</h4><p>Try a different search or filter.</p></div>`:''}
    </div>
    <footer class="app-footer">Event Command Center — your data is stored privately on this device.</footer>
  `;
  renderThemeToggleIcon();
  qs('#themeToggleBtn').addEventListener('click', toggleTheme);
  qs('#createEventCard').addEventListener('click', ()=>{
    if(isEventCreationLocked()){ openActivationModal(`The free trial is limited to ${DEMO_EVENT_LIMIT} event. Enter your activation code to create unlimited events.`); return; }
    pushOverlayState(); renderOnboarding({allowCancel: total>0});
  });
  qs('#createEventCard').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(isEventCreationLocked()){ openActivationModal(`The free trial is limited to ${DEMO_EVENT_LIMIT} event. Enter your activation code to create unlimited events.`); return; }
    pushOverlayState(); renderOnboarding({allowCancel: total>0});
  }});
  const meQ = qs('#meQ'); if(meQ) meQ.addEventListener('input', e=>{ myEventsQuery=e.target.value; renderMyEvents(); });
  const meSort = qs('#meSort'); if(meSort) meSort.addEventListener('change', e=>{ myEventsSort=e.target.value; renderMyEvents(); });
  const meFilter = qs('#meFilter'); if(meFilter) meFilter.addEventListener('change', e=>{ myEventsFilter=e.target.value; renderMyEvents(); });

  qsa('[data-openevent]',app).forEach(b=> b.addEventListener('click', ()=> enterEvent(b.dataset.openevent)));
  qsa('.myevents-card',app).forEach(card=> card.addEventListener('click', (e)=>{
    if(e.target.closest('[data-cardmenu]')||e.target.closest('.hero-menu')||e.target.closest('[data-openevent]')) return;
    enterEvent(card.dataset.eventid);
  }));
  qsa('[data-cardmenu]',app).forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    const id = b.dataset.cardmenu;
    openCardMenuId = (openCardMenuId===id) ? null : id;
    renderMyEvents();
  }));
  document.addEventListener('click', myEventsMenuOutsideClick);
  qsa('[data-cardaction]',app).forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    const id = b.dataset.id, action = b.dataset.cardaction;
    openCardMenuId = null;
    handleEventCardAction(action, id);
  }));
}

      <div class="myevents-card-stats">${stats.totalGuests} Guests · ${stats.tasksDone}/${stats.tasks.length} Tasks · ${money2(stats.totalActual, ev)} Spent</div>

            <button class="hero-menu-item" data-cardaction="duplicate" data-id="${ev.id}">${icon('backup')} Duplicate Event</button>

function money2(n, ev){
  const sym = CURRENCY_SYMBOLS[ev.event.currency] || (ev.event.currency? ev.event.currency+' ':'$');
  const abs = Math.abs(Number(n)||0);
  const short = abs>=1000 ? (abs/1000).toFixed(1)+'K' : abs.toFixed(0);
  return sym+short;
}
function enterEvent(id){
  openEvent(id);
  CURRENT_TAB = 'dashboard';
  applyEventTheme();
  renderShell();
  pushNavState({view:'event', eventId:id});
}
function handleEventCardAction(action, id){
  const ev = APP.events[id]; if(!ev) return;
  if(action==='open'){ enterEvent(id); return; }
  if(action==='edit'){ openEditEventCardModal(ev); return; }
  if(action==='duplicate'){
    const copy = duplicateEvent(id);
    if(copy==='LOCKED'){ openActivationModal(`The free trial is limited to ${DEMO_EVENT_LIMIT} event. Enter your activation code to create unlimited events.`); return; }
    toast('Event duplicated'); renderMyEvents();
    return;
  }
  if(action==='backup'){ downloadEventBackup(ev); return; }
  if(action==='delete'){
    confirmDialog(`Delete "${ev.event.name||'this event'}"? This will permanently remove this event and its guests, tasks, vendors, expenses, schedule and notes from this device. This action cannot be undone.`, ()=>{
      deleteEvent(id); toast('Event deleted'); renderMyEvents();
    }, {title:'Delete Event', okLabel:'Delete Event'});
    return;
  }
}
function downloadEventBackup(ev){
  const blob = new Blob([JSON.stringify(ev,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = (ev.event.name||'event').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.href=url; a.download = `${fname}-event-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Event backup downloaded');
}
function openEditEventCardModal(ev){
  openModal({
    title:'Edit Event Details',
    bodyHtml:`
      <div class="form-grid">
        <div class="field full" data-required><label>Event Name <span class="req">*</span></label><input id="ec_name" value="${escapeHtml(ev.event.name)}"><div class="field-error">Event name is required.</div></div>

        <div class="field" data-required><label>Event Date <span class="req">*</span></label><input type="date" id="ec_date" value="${escapeHtml(ev.event.date)}"><div class="field-error">Event date is required.</div></div>

        <div class="field"><label>Currency</label><select id="ec_currency">${Object.keys(CURRENCY_SYMBOLS).map(c=>`<option value="${c}" ${c===ev.event.currency?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>`,
    footerHtml:`<button class="btn" id="ecCancel">Cancel</button><button class="btn btn-primary" id="ecSave">${icon('check')} Save Changes</button>`,
    onMount:(o)=>{
      qs('#ec_type',o).addEventListener('change', e=> qs('#ec_customtype_wrap',o).classList.toggle('hidden', e.target.value!=='other'));
      qs('#ecCancel',o).addEventListener('click', closeModal);
      qs('#ecSave',o).addEventListener('click', ()=>{
        if(!validateForm(o)) return;
        ev.event.name = qs('#ec_name',o).value.trim();
        ev.event.type = qs('#ec_type',o).value;
        ev.event.customTypeLabel = qs('#ec_customtype',o).value.trim();
        ev.event.date = qs('#ec_date',o).value;
        ev.event.organizer = qs('#ec_organizer',o).value.trim();
        ev.event.venue = qs('#ec_venue',o).value.trim();
        ev.event.totalBudget = parseFloat(qs('#ec_budget',o).value)||0;
        ev.event.currency = qs('#ec_currency',o).value;
        APP.events[ev.id] = ev; saveAppData();
        closeModal(); toast('Event details updated'); renderMyEvents();
      });
    }
  });
}

          <div class="field" data-required><label>Event Date <span class="req">*</span></label><input type="date" id="ob_date"><div class="field-error">Event date is required.</div></div>
          <div class="field"><label>Organizer Name</label><input id="ob_organizer"></div>
          <div class="field full"><label>Location / Venue</label><input id="ob_venue"></div>
          <div class="field"><label>Total Budget</label><input type="number" min="0" id="ob_budget" placeholder="0"></div>
          <div class="field"><label>Currency</label><select id="ob_currency">${Object.keys(CURRENCY_SYMBOLS).map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
          <div class="field full"><label>Estimated Guest Count</label><input type="number" min="0" id="ob_guestcount" placeholder="0"></div>
        </div>

  renderStep();
}

/* ============================================================
   DERIVED STATS (single source of truth for Dashboard/Reports)
   ============================================================ */
function computeStats(ev){
  ev = ev || STATE;
  const guests = ev.guests, tasks = ev.tasks, vendors = ev.vendors, expenses = ev.expenses;
  const confirmed = guests.filter(g=>g.rsvp==='Confirmed').length;
  const pending = guests.filter(g=>g.rsvp==='Pending'||g.rsvp==='Invited').length;
  const totalGuests = guests.reduce((s,g)=> s + 1 + (parseInt(g.partySize)||0), 0);
  const tasksDone = tasks.filter(t=>t.status==='Completed').length;
  const tasksRemaining = tasks.length - tasksDone;
  const overdueTasks = tasks.filter(t=> t.status!=='Completed' && t.dueDate && t.dueDate < todayISO());
  const totalActual = expenses.reduce((s,e)=> s + (parseFloat(e.actual)||0), 0);
  const totalEstimated = expenses.reduce((s,e)=> s + (parseFloat(e.estimated)||0), 0);
  const totalPaid = expenses.reduce((s,e)=> s + (parseFloat(e.paid)||0), 0);
  const outstanding = expenses.reduce((s,e)=> s + Math.max((parseFloat(e.actual)||0) - (parseFloat(e.paid)||0), 0), 0);
  const remainingBudget = (parseFloat(ev.event.totalBudget)||0) - totalActual;
  const vendorsBooked = vendors.filter(v=>v.status==='Booked'||v.status==='Completed').length;
  const planningItems = tasks.length;
  const progress = planningItems>0 ? Math.round((tasksDone/planningItems)*100) : 0;
  return {guests, tasks, vendors, expenses, confirmed, pending, totalGuests, tasksDone, tasksRemaining,
    overdueTasks, totalActual, totalEstimated, totalPaid, outstanding, remainingBudget, vendorsBooked, progress};
}

const TASK_CATEGORIES = ['Venue','Guests','Food','Decor','Entertainment','Logistics','Payments','Communication'];
const TASK_STATUSES = ['Not Started','In Progress','Completed'];
let taskFilters = {q:'', status:'', priority:''};
function renderTasks(host){
  const f = taskFilters;
  let list = STATE.tasks.slice();
  if(f.q) list = list.filter(t=> t.title.toLowerCase().includes(f.q.toLowerCase()));

  list.sort((a,b)=> (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const overdueIds = new Set(STATE.tasks.filter(t=>t.status!=='Completed'&&t.dueDate&&t.dueDate<todayISO()).map(t=>t.id));

  host.innerHTML = `
    <div class="page-header">
      <div><h2>Tasks</h2><div class="page-header-sub">${STATE.tasks.filter(t=>t.status==='Completed').length}/${STATE.tasks.length} completed${overdueIds.size?` · ${overdueIds.size} overdue`:''}</div></div>

      </tr>`).join('')}</tbody>
    </table></div>` : emptyState('tasks','No tasks yet','Break your planning into manageable tasks.', 'addTaskBtn2')}
  `;
  qs('#addTaskBtn').addEventListener('click', ()=>openTaskModal());
  const es = qs('#addTaskBtn2'); if(es) es.addEventListener('click', ()=>openTaskModal());
  qs('#tQ').addEventListener('input', e=>{ taskFilters.q=e.target.value; renderTasks(host); });
  qs('#tStatus').addEventListener('change', e=>{ taskFilters.status=e.target.value; renderTasks(host); });
  qs('#tPriority').addEventListener('change', e=>{ taskFilters.priority=e.target.value; renderTasks(host); });
  qsa('[data-toggle]',host).forEach(cb=> cb.addEventListener('click', e=> e.stopPropagation()));

    const t = STATE.tasks.find(x=>x.id===cb.dataset.toggle);

    if(CURRENT_TAB==='dashboard') refreshCurrentTab();
  }));
  qsa('tr[data-rowclick]',host).forEach(tr=> tr.addEventListener('click', e=>{
    if(e.target.closest('.row-actions')||e.target.closest('[data-toggle]')) return;
    openTaskModal(STATE.tasks.find(t=>t.id===tr.dataset.rowclick));
  }));
  qsa('[data-edit]',host).forEach(b=> b.addEventListener('click', e=>{ e.stopPropagation(); openTaskModal(STATE.tasks.find(t=>t.id===b.dataset.edit)); }));
  qsa('[data-del]',host).forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    confirmDialog('Delete this task?', ()=>{ STATE.tasks = STATE.tasks.filter(t=>t.id!==b.dataset.del); logActivity('Task deleted'); saveState(); renderTasks(host); toast('Task deleted'); });

/* ============================================================
   CALENDAR
   ============================================================ */
let calCursor = new Date();
function calendarEventsFor(dateStr){
  const items = [];
  STATE.tasks.forEach(t=> t.dueDate===dateStr && items.push({label:t.title, type:'task', id:t.id}));
  STATE.schedule.forEach(x=> x.date===dateStr && items.push({label:x.title, type:'schedule', id:x.id}));
  STATE.vendors.forEach(v=> v.dueDate===dateStr && items.push({label:v.name+' payment', type:'vendor', id:v.id}));
  STATE.expenses.forEach(e=> e.dueDate===dateStr && items.push({label:e.name+' due', type:'expense', id:e.id}));
  if(STATE.event.date===dateStr) items.unshift({label:activeEventTypeLabel()+' Day', type:'event', id:'event'});
  return items;
}
function renderCalendar(host){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y,m,1), startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:daysInPrev-i, other:true, dateStr:null});
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({d, other:false, dateStr});
  }
  while(cells.length%7!==0) cells.push({d:cells.length, other:true, dateStr:null});
  const monthLabel = calCursor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  host.innerHTML = `
    <div class="page-header">
      <div><h2>Calendar</h2><div class="page-header-sub">Tasks, payments, vendor appointments & schedule combined</div></div>
      <div class="flex gap-8" style="flex-wrap:wrap;">
        <button class="btn btn-sm" id="calToday">Today</button>
        <button class="icon-btn" id="calPrev">${icon('chevLeft')}</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="icon-btn" id="calNext">${icon('chevRight')}</button>
      </div>
    </div>
    <div class="card">
      <div class="cal-grid" style="margin-bottom:6px;">${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells.map(c=>{
        const isToday = c.dateStr===todayISO();
        const evs = c.dateStr? calendarEventsFor(c.dateStr):[];
        return `<div class="cal-cell ${isToday?'today':''} ${c.other?'other-month':''}" ${c.dateStr?`data-caldate="${c.dateStr}" tabindex="0" role="button" aria-label="${c.dateStr}"`:''}>
          <div class="cal-daynum">${c.d}</div>
          ${evs.slice(0,3).map(e=>`<div class="cal-event" data-caltype="${e.type}" data-calid="${e.id}" role="button" tabindex="0" aria-label="${escapeHtml(e.label)}">${escapeHtml(e.label)}</div>`).join('')}
          ${evs.length>3? `<div class="stat-sub">+${evs.length-3} more</div>`:''}
        </div>`;
      }).join('')}</div>
    </div>
  `;
  qs('#calToday').addEventListener('click', ()=>{ calCursor=new Date(); renderCalendar(host); });
  qs('#calPrev').addEventListener('click', ()=>{ calCursor=new Date(y,m-1,1); renderCalendar(host); });
  qs('#calNext').addEventListener('click', ()=>{ calCursor=new Date(y,m+1,1); renderCalendar(host); });
  qsa('.cal-event',host).forEach(e=> e.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const cell = e.closest('.cal-cell[data-caldate]');
    if(cell) openDayDetailModal(cell.dataset.caldate);
  }));
  qsa('.cal-cell[data-caldate]',host).forEach(c=>{
    c.addEventListener('click', ()=> openDayDetailModal(c.dataset.caldate));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDayDetailModal(c.dataset.caldate); }});
  });
}
function openCalendarItem(type, id){
  if(type==='task'){ goTab('tasks'); setTimeout(()=>openTaskModal(STATE.tasks.find(t=>t.id===id)),80); }
  else if(type==='schedule'){ goTab('schedule'); setTimeout(()=>openScheduleModal(STATE.schedule.find(x=>x.id===id)),80); }
  else if(type==='vendor'){ goTab('vendors'); setTimeout(()=>openVendorModal(STATE.vendors.find(v=>v.id===id)),80); }
  else if(type==='expense'){ goTab('budget'); setTimeout(()=>openExpenseModal(STATE.expenses.find(x=>x.id===id)),80); }
}
const CAL_TYPE_ICON = {task:'tasks', schedule:'schedule', vendor:'vendors', expense:'budget', event:'sparkle'};
function openDayDetailModal(dateStr){
  const items = calendarEventsFor(dateStr).filter(i=>i.type!=='event');
  const isEventDay = STATE.event.date===dateStr;
  const dateLabel = fmtDate(dateStr);
  openModal({
    title: dateLabel,
    bodyHtml:`
      ${isEventDay? `<div class="badge badge-primary mt-2" style="margin-bottom:12px;">${icon('sparkle')} ${escapeHtml(activeEventTypeLabel())} Day</div>`:''}
      <div id="dayItemsList">
        ${items.length? items.map(i=>`<div class="list-row" data-clickrow data-caltype="${i.type}" data-calid="${i.id}">
          <span class="search-result-icon">${icon(CAL_TYPE_ICON[i.type]||'sparkle')}</span>
          <span class="list-row-title">${escapeHtml(i.label)}</span>
          <span class="badge badge-muted">${i.type}</span>
        </div>`).join('') : `<div class="stat-sub" style="padding:10px 0;">No items scheduled for this day.</div>`}
      </div>
      <div class="mt-3" style="border-top:1px solid var(--border);padding-top:14px;">
        <label style="font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-bottom:8px;display:block;">+ Add Item</label>
        <div class="quick-actions">
          <div class="quick-action" data-addtype="task">${icon('tasks','qa-icon')}<span>Task</span></div>
          <div class="quick-action" data-addtype="schedule">${icon('schedule','qa-icon')}<span>Schedule Item</span></div>
          <div class="quick-action" data-addtype="expense">${icon('budget','qa-icon')}<span>Payment</span></div>
          <div class="quick-action" data-addtype="vendor">${icon('vendors','qa-icon')}<span>Vendor Appt.</span></div>
        </div>
      </div>`,
    footerHtml:`<button class="btn" id="ddClose">Close</button>`,
    onMount:(o)=>{
      qs('#ddClose',o).addEventListener('click', closeModal);
      qsa('[data-clickrow]',o).forEach(r=> r.addEventListener('click', ()=>{ closeModal(); openCalendarItem(r.dataset.caltype, r.dataset.calid); }));
      qsa('[data-addtype]',o).forEach(b=> b.addEventListener('click', ()=>{
        closeModal();
        const type = b.dataset.addtype;
        if(type==='task') openTaskModal(null, {dueDate:dateStr});
        else if(type==='schedule') openScheduleModal(null, {date:dateStr});
        else if(type==='expense') openExpenseModal(null, {dueDate:dateStr});
        else if(type==='vendor') openVendorModal(null, {dueDate:dateStr});
      }));
    }
  });
}

        <div class="card-title">Budget Overview</div>

      <div class="card span-6">
        <div class="card-title">RSVP Breakdown</div>
        ${Object.entries(rsvpCounts).map(([k,v])=> STATE.guests.length? `<div style="margin-bottom:8px;"><div class="flex-between" style="font-size:12.5px;margin-bottom:3px;"><span>${k}</span><span style="font-weight:700">${v}</span></div><div class="progress-track"><div class="progress-fill" style="width:${(v/STATE.guests.length*100)}%"></div></div></div>`:'').join('') || emptyRow('No guests yet.')}
      </div>

        <div class="card-title">Expense Categories</div>
        ${Object.keys(byCat).length? Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-bottom:8px;"><div class="flex-between" style="font-size:12.5px;margin-bottom:3px;"><span>${escapeHtml(c)}</span><span style="font-weight:700">${money(v)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${(v/maxCat*100)}%"></div></div></div>`).join(''):emptyRow('No expenses yet.')}
      </div>
      <div class="card span-6">
        <div class="card-title">Upcoming Deadlines</div>
        ${upcomingDeadlines.length? upcomingDeadlines.map(t=>`<div class="list-row"><span class="list-row-title">${escapeHtml(t.title)}</span><span class="list-row-meta">${fmtDate(t.dueDate)}</span></div>`).join(''):emptyRow('No upcoming deadlines.')}
